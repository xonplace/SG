{% extends "base.html" %}

{% block title %}{{ title }} | Sistema de gestion{% endblock %}

{% block content %}
<section class="sg-page">
  <div class="sg-page-header">
    <div>
      <p class="sg-section-kicker">{{ eyebrow }}</p>
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
    </div>
    <a href="{% url 'findings:list' %}" class="sg-button-secondary">Ver todos</a>
  </div>

  {% include "findings/partials/finding_table.html" with findings=findings empty_message=empty_message %}
</section>
{% endblock %}
