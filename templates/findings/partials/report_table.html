<article class="sg-dashboard-card">
  <div class="mb-3 flex items-center justify-between gap-4">
    <h2 class="sg-section-title">{{ title }}</h2>
    <span class="text-xs font-medium uppercase tracking-wide text-neutral-400">Ranking</span>
  </div>
  <div class="space-y-2">
    {% for row in rows %}
      <div class="sg-bi-row">
        <div class="flex items-center justify-between gap-4 text-sm">
          <div class="flex min-w-0 items-center gap-3">
            <span class="sg-bi-dot" style="background: {{ row.color }};"></span>
            <span class="min-w-0 truncate font-semibold text-neutral-800">{{ row.label }}</span>
          </div>
          <span class="shrink-0 rounded-full bg-white px-2.5 py-1 text-xs font-semibold text-neutral-950 shadow-sm">{{ row.total }}</span>
        </div>
        <div class="mt-2 flex items-center gap-3">
          <div class="sg-bi-track flex-1">
            <div class="sg-bi-bar" style="--bar-color: {{ row.color }}; width: {{ row.percent }}%;">
              <span class="sg-bi-bar-glow"></span>
            </div>
          </div>
          <span class="w-10 text-right text-xs font-medium text-neutral-500">{{ row.percent }}%</span>
        </div>
      </div>
    {% empty %}
      <p class="rounded-lg border border-dashed border-neutral-300 p-4 text-sm text-neutral-500">{{ empty_message }}</p>
    {% endfor %}
  </div>
</article>
