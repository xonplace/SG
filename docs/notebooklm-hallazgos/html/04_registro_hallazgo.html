<script>
  function toggleField(fieldName, show) {
    const field = document.querySelector(`[data-field-name="${fieldName}"]`);
    if (field) field.classList.toggle("hidden", !show);
  }

  function updateFindingFields() {
    const process = document.querySelector("#id_process");
    const source = document.querySelector("#id_source");
    toggleField("process_other", process && process.value === "Otro");
    toggleField("source_other", source && source.value === "otro");
  }

  document.addEventListener("change", updateFindingFields);
  document.addEventListener("DOMContentLoaded", updateFindingFields);
